# The Python scripts (scripts/): their linter and the packages some of them import. No build, nothing to install.
[project]
name = "skyrimcoop-scripts"
version = "0"
requires-python = ">=3.10"
dependencies = [
    "mcp<2",   # coop_mcp.py, the repro MCP (brings anyio); 2.x renamed FastMCP
    "lz4",     # re/save_diff.py, re/behavior_dump.py
    "Pillow",  # analyze_green_flash.py, the physics_green scenario
    "psutil",  # coop_harness/windows.py (Windows only)
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]  # real mistakes only: pyflakes and syntax errors
