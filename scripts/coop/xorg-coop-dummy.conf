# Off-screen X server for scripts/coop_test.py: Xorg's dummy driver with a real 60 Hz mode
# (Xvfb reports 0 Hz, which makes DXVK divide by zero during Skyrim's renderer init).
# Installed to /etc/X11 by `scripts/coop_test.py setup-display` (Xorg only reads custom
# configs from system paths when not run as root).
Section "Device"
    Identifier "CoopDummyDevice"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Monitor"
    Identifier "CoopDummyMonitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "1920x1080_60" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync
EndSection

Section "Screen"
    Identifier "CoopDummyScreen"
    Device "CoopDummyDevice"
    Monitor "CoopDummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080_60"
        Virtual 1920 1080
    EndSubSection
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
EndSection
