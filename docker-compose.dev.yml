services:
  skyrimcoop-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: skyrimcoop-dev:latest
    container_name: skyrimcoop-dev
    volumes:
      # Mount the entire project directory
      - .:/workspace
      # Cache XMake build artifacts
      - xmake-cache:/root/.xmake
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      - XMAKE_GLOBALDIR=/workspace
      - XMAKE_ROOT=y
      - XMAKE_JOBS=8  # Use all 8 CPU cores
    # Resource limits to prevent crashes during compilation
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 32G
        reservations:
          memory: 16G

volumes:
  xmake-cache:
    name: skyrimcoop-xmake-cache
